name: Weekly summary

# Friday 6pm ET (22:00 UTC in summer). Posts the applied/skipped conversion
# stats for the past seven days to the same Telegram chat.
on:
  schedule:
    - cron: "0 22 * * 5"
  workflow_dispatch:

concurrency:
  group: salesradar-state
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Send the weekly summary
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python -m salesradar --weekly-summary

      - name: Commit the updated database
        if: always()
        run: |
          git config user.name "salesradar-bot"
          git config user.email "salesradar-bot@users.noreply.github.com"
          git add -f data/salesradar.db
          git diff --staged --quiet || git commit -m "chore: update salesradar state [skip ci]"
          git push || echo "::warning::Could not push updated state."
